name: Flutter CI/CD

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'refactor/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  # ── Lint & Analyze Job ──────────────────────────────────────
  lint:
    name: Lint & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: Frontend
        run: flutter pub get

      - name: Format check
        working-directory: Frontend
        run: dart format --set-exit-if-changed lib/

      - name: Analyze
        working-directory: Frontend
        run: flutter analyze --no-fatal-infos || true

  # ── Build APK Job (parallel with lint) ──────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: Frontend
        run: flutter pub get

      - name: Build APK (Debug)
        working-directory: Frontend
        run: flutter build apk --debug

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: Frontend/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
